<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-IoT SAR Soil Moisture Dashboard</title>
    
    <!-- Leaflet CSS for Interactive Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1b4332;
            color: #ffffff;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        header h1 {
            font-size: 1.4rem;
        }

        .container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 10px;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        #map {
            height: 350px;
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1;
        }

        .dashboard {
            background: #ffffff;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-title {
            font-weight: 600;
            color: #2d6a4f;
            border-bottom: 2px solid #d8f3dc;
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table td {
            padding: 8px 5px;
            border-bottom: 1px solid #eee;
            font-size: 0.95rem;
        }

        .data-table tr td:first-child {
            font-weight: bold;
            color: #555;
            width: 45%;
        }

        .value-highlight {
            color: #1b4332;
            font-weight: bold;
        }

        .sar-preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #222;
            border-radius: 8px;
            padding: 10px;
            color: #fff;
            min-height: 180px;
        }

        #sar-image-preview {
            max-width: 100%;
            max-height: 160px;
            border-radius: 4px;
            border: 1px solid #444;
            display: none;
        }

        .loading-text {
            color: #888;
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            background-color: #ffb703;
            color: #000;
        }

        .status-badge.success {
            background-color: #52b788;
            color: #fff;
        }

        .status-badge.error {
            background-color: #e63946;
            color: #fff;
        }

        @media (min-width: 768px) {
            .container {
                flex-direction: row;
                padding: 20px;
            }
            #map {
                flex: 1.5;
                height: auto;
                min-height: 500px;
            }
            .dashboard {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>AI-IoT SAR Soil Moisture Tracker</h1>
    </header>

    <div class="container">
        <!-- Interactive Map -->
        <div id="map"></div>

        <!-- Dashboard Panel -->
        <div class="dashboard">
            <div>
                <h3 class="card-title">Analytics & Query Data</h3>
                <table class="data-table">
                    <tr>
                        <td>Status:</td>
                        <td><span id="server-status" class="status-badge">Tap Map to Query</span></td>
                    </tr>
                    <tr>
                        <td>Clicked Lat/Lng:</td>
                        <td id="clicked-coords" class="value-highlight">-- , --</td>
                    </tr>
                    <tr>
                        <td>Matched Lat/Lng:</td>
                        <td id="matched-coords" class="value-highlight">-- , --</td>
                    </tr>
                    <tr>
                        <td>H5 Soil Moisture:</td>
                        <td id="h5-moisture-td" class="value-highlight" style="font-size: 1.2rem; color: #2d6a4f;">-- %</td>
                    </tr>
                </table>
            </div>

            <div>
                <h3 class="card-title">SAR Radar Band Crop Slice</h3>
                <div class="sar-preview-container">
                    <span id="sar-placeholder" class="loading-text">Select a coordinate on the map to extract the SAR preview crop.</span>
                    <img id="sar-image-preview" alt="SAR Crop Slice Preview" />
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS for Map Controls -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize Map centered around Tamil Nadu default coordinates
        const defaultLat = 11.34100;
        const defaultLng = 77.71700;
        
        const map = L.map('map').setView([defaultLat, defaultLng], 12);

        // 2. Add ESRI World Imagery (Satellite Layer)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        }).addTo(map);

        // Add Marker
        let selectedMarker = L.marker([defaultLat, defaultLng]).addTo(map)
            .bindPopup("Tap anywhere on the map to fetch SAR data.")
            .openPopup();

        // 3. Map Click Event Handler
        map.on('click', function(e) {
            const lat = e.latlng.lat.toFixed(5);
            const lng = e.latlng.lng.toFixed(5);

            // Move marker to clicked point
            selectedMarker.setLatLng(e.latlng);

            // Update UI elements
            document.getElementById('clicked-coords').innerText = `${lat}, ${lng}`;
            
            const statusBadge = document.getElementById('server-status');
            statusBadge.innerText = 'Querying Render...';
            statusBadge.className = 'status-badge';

            const sarPlaceholder = document.getElementById('sar-placeholder');
            const sarImage = document.getElementById('sar-image-preview');
            sarPlaceholder.style.display = 'block';
            sarPlaceholder.innerText = 'Loading SAR radar slice...';
            sarImage.style.display = 'none';

            // 4. Send request to live Render Cloud Server
            fetch('https://sar-backend-api.onrender.com/get-sar-data', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({ 
                    lat: parseFloat(lat), 
                    lng: parseFloat(lng) 
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    // Update table with server values
                    document.getElementById('matched-coords').innerText = `${data.matched_lat}, ${data.matched_lng}`;
                    document.getElementById('h5-moisture-td').innerText = data.h5_moisture;

                    // Display returned Base64 SAR Image slice
                    if (data.sar_image) {
                        sarImage.src = data.sar_image;
                        sarImage.style.display = 'block';
                        sarPlaceholder.style.display = 'none';
                    }

                    statusBadge.innerText = 'Success';
                    statusBadge.className = 'status-badge success';
                } else {
                    throw new Error(data.message || 'Error parsing H5 file.');
                }
            })
            .catch(err => {
                console.error("Render Server Fetch Error:", err);
                statusBadge.innerText = 'Fetch Failed';
                statusBadge.className = 'status-badge error';
                sarPlaceholder.innerText = 'Failed to load SAR radar image.';
            });
        });
    </script>
</body>
</html>
